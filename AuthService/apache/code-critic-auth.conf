# Example Apache config for AuthService.
#
# Required Apache modules:
# - headers
# - proxy
# - proxy_http
# - shib
#
# HTTPS-fronted layout:
# - Apache is the public frontend on :443
# - cc.net runs internally on localhost:5000
# - AuthService stays on localhost only
# - Shibboleth handlers live on the same HTTPS frontend
#
# Adjust hostnames and paths before deployment.

<VirtualHost *:443>
    ServerName code-critic.nti.tul.cz

    SSLEngine on
    # Expected TLS material on the VM:
    # - certificate or fullchain PEM:
    #     /etc/ssl/certs/code-critic.nti.tul.cz.crt
    # - private key PEM:
    #     /etc/ssl/private/code-critic.nti.tul.cz.key
    # - optional separate CA chain PEM if the certificate file is not already a full chain:
    #     /etc/ssl/certs/code-critic.nti.tul.cz-chain.crt
    SSLCertificateFile /etc/ssl/certs/code-critic.nti.tul.cz.crt
    SSLCertificateKeyFile /etc/ssl/private/code-critic.nti.tul.cz.key
    # SSLCertificateChainFile /etc/ssl/certs/code-critic.nti.tul.cz-chain.crt

    ProxyPreserveHost On

    # Keep Shibboleth handlers local to Apache/mod_shib.
    ProxyPass /Shibboleth.sso !

    # AuthService routes.
    ProxyPass /health http://127.0.0.1:8181/health retry=0
    ProxyPassReverse /health http://127.0.0.1:8181/health
    # AuthService routes.
    ProxyPass /auth/ http://127.0.0.1:8181/auth/ retry=0
    ProxyPassReverse /auth/ http://127.0.0.1:8181/auth/
    ProxyPass /secure/ http://127.0.0.1:8181/secure/ retry=0
    ProxyPassReverse /secure/ http://127.0.0.1:8181/secure/

    # Main Code Critic application.
    ProxyPass / http://127.0.0.1:5000/ retry=0
    ProxyPassReverse / http://127.0.0.1:5000/

    <Location /Shibboleth.sso>
        SetHandler shib
    </Location>

    # Remove any client-supplied identity headers before setting trusted values.
    RequestHeader unset X-Remote-Eppn
    RequestHeader unset X-Remote-Affiliation
    RequestHeader unset X-Remote-Display-Name
    RequestHeader unset X-Remote-Identity-Provider

    <Location /auth/index.php>
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        ShibUseHeaders on
        Require valid-user

        # Map Shibboleth attributes to headers forwarded to the localhost app.
        RequestHeader set X-Remote-Eppn %{eppn}e env=eppn
        RequestHeader set X-Remote-Affiliation %{affiliation}e env=affiliation
        RequestHeader set X-Remote-Display-Name %{displayName}e env=displayName
        RequestHeader set X-Remote-Identity-Provider %{Shib-Identity-Provider}e env=Shib-Identity-Provider
    </Location>

    <Location /auth/debug/>
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        ShibUseHeaders on
        Require valid-user

        RequestHeader set X-Remote-Eppn %{eppn}e env=eppn
        RequestHeader set X-Remote-Affiliation %{affiliation}e env=affiliation
        RequestHeader set X-Remote-Display-Name %{displayName}e env=displayName
        RequestHeader set X-Remote-Identity-Provider %{Shib-Identity-Provider}e env=Shib-Identity-Provider
    </Location>

    # Optional diagnostics during initial rollout:
    # <Location /Shibboleth.sso/Session>
    #     AuthType shibboleth
    #     ShibRequestSetting requireSession 1
    #     Require valid-user
    # </Location>

    ErrorLog ${APACHE_LOG_DIR}/code-critic-https-error.log
    CustomLog ${APACHE_LOG_DIR}/code-critic-https-access.log combined
</VirtualHost>
